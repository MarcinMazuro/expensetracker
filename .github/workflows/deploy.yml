name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: expensetracker-mm
  REGION: europe-west1

permissions:
  contents: read
  id-token: write # required by Workload Identity Federation

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    name: Build image and deploy
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/183279256871/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deployer@expensetracker-mm.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Cloud Build -> Cloud Run
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --substitutions SHORT_SHA="${GITHUB_SHA::7}" \
            --service-account "projects/$PROJECT_ID/serviceAccounts/183279256871-compute@developer.gserviceaccount.com"

      - name: Deployed service URL
        run: |
          URL=$(gcloud run services describe expensetracker-web \
            --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')
          echo "### Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"
