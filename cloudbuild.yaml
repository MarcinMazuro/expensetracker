# CI/CD pipeline: push to main -> build image -> deploy to Cloud Run
substitutions:
  _REGION: europe-west1
  _REPO: web
  _SERVICE: expensetracker-web

steps:
  # Avatar photos are not in the public repository (licence) - they come
  # from a private bucket into public/avatars before the image is built
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: avatars
    entrypoint: bash
    args:
      - -c
      - mkdir -p public/avatars && gcloud storage cp "gs://$PROJECT_ID-assets/avatars/*" public/avatars/

  # Build using the previous image as a layer cache
  - name: gcr.io/cloud-builders/docker
    id: build
    entrypoint: bash
    args:
      - -c
      - |
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"
        docker pull "$$IMAGE:latest" || true
        docker build \
          --cache-from "$$IMAGE:latest" \
          --build-arg VERSION=$SHORT_SHA \
          -t "$$IMAGE:$SHORT_SHA" \
          -t "$$IMAGE:latest" \
          .

  - name: gcr.io/cloud-builders/docker
    id: push
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=web-app@$PROJECT_ID.iam.gserviceaccount.com
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=2
      - --cpu=1
      - --memory=1Gi
      - --cpu-boost
      - --timeout=120
      - --port=8080

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  # No machineType: a new project has no quota for E2_HIGHCPU_8
  # (FAILED_PRECONDITION), the default machine is enough
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
